<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gate Cascade Bot</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Gate Cascade Bot</h1>
    <span id="mode-badge" class="badge">…</span>
    <span id="user-email" class="user-email"></span>
    <div class="topbar-actions">
      <button id="admin-btn" class="btn" hidden>Admin</button>
      <button id="settings-btn" class="btn">Settings</button>
      <button id="logout-btn" class="btn">Logout</button>
    </div>
  </header>

  <section id="chart-panel" hidden>
    <div class="chart-row">
      <div class="chart-main">
        <div id="tradingview-chart-container"></div>
      </div>
      <div class="chart-sidebar">
        <div class="chart-sidebar-search">
          <input type="text" id="chart-symbol-input" placeholder="Search coin" value="BTC_USDT" />
          <button id="chart-load-btn" class="btn primary">Go</button>
        </div>
        <div class="chart-sidebar-label">Trending</div>
        <div id="chart-coin-list" class="chart-coin-list">
          <div class="empty">Loading…</div>
        </div>
      </div>
    </div>
  </section>

  <main>
    <section id="admin-view" hidden>
      <div class="section-head">
        <h2>Admin</h2>
        <button id="admin-back-btn" class="btn">&larr; Back to list</button>
      </div>
      <div id="admin-error" class="error" hidden></div>

      <form id="invite-form" class="create-form">
        <div class="form-grid">
          <label>
            <span>Invite new user (email)</span>
            <input type="email" id="a-invite-email" required />
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="a-invite-admin" />
            <span>Make them an admin too</span>
          </label>
        </div>
        <div class="actions">
          <button type="submit" class="btn primary">Send Invite</button>
        </div>
      </form>

      <div id="admin-link-box" class="success" hidden></div>

      <h3>Users</h3>
      <table class="cascades-table">
        <thead>
          <tr>
            <th>Email</th>
            <th>Admin</th>
            <th>Dry Run</th>
            <th>API Key</th>
            <th>Created</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="admin-users-tbody"></tbody>
      </table>
    </section>

    <section id="settings-view" hidden>
      <div class="section-head">
        <h2>Settings</h2>
        <button id="settings-back-btn" class="btn">&larr; Back to list</button>
      </div>
      <div id="settings-error" class="error" hidden></div>
      <div id="settings-success" class="success" hidden></div>

      <form id="settings-form" class="create-form">
        <div class="form-grid">
          <label>
            <span>Gate.io API Key</span>
            <input type="text" id="s-api-key" placeholder="leave blank to keep current" autocomplete="off" />
          </label>
          <label>
            <span>Gate.io API Secret</span>
            <input type="password" id="s-api-secret" placeholder="leave blank to keep current" autocomplete="off" />
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="s-dry-run" />
            <span>Dry Run (no real orders sent to Gate.io)</span>
          </label>
        </div>
        <div id="settings-key-status" class="field-label"></div>
        <div id="settings-test-result" hidden></div>
        <div class="actions">
          <button type="submit" class="btn primary">Save Settings</button>
          <button type="button" id="settings-test-btn" class="btn">Test</button>
        </div>
      </form>
    </section>

    <section id="list-view">
      <div class="section-head">
        <h2>Cascades</h2>
        <div class="section-head-actions">
          <button id="new-cascade-btn" class="btn primary">+ New Cascade</button>
          <button id="new-template-btn" class="btn primary">+ Manual Template</button>
          <button id="refresh-list-btn" class="btn">Refresh</button>
        </div>
      </div>
      <div id="list-error" class="error" hidden></div>

      <form id="create-form" class="create-form" hidden>
        <div class="form-grid">
          <label>
            <span>Pair</span>
            <input type="text" id="f-symbol" placeholder="DOGE_USDT" required />
          </label>
          <label>
            <span>Trigger Price <em>(optional)</em></span>
            <input type="number" id="f-trigger_price" step="any" placeholder="arm immediately if blank" />
          </label>
          <label>
            <span>Number of Levels</span>
            <input type="number" id="f-num_levels" step="1" min="1" required />
          </label>
          <label>
            <span>Base Price (level 1 buy)</span>
            <input type="number" id="f-base_price" step="any" required />
          </label>
          <label>
            <span>Base Amount (USDT)</span>
            <input type="number" id="f-base_amount_usdt" step="any" required />
          </label>
          <label>
            <span>Price Step % (per level down)</span>
            <input type="number" id="f-price_step_pct" step="any" required />
          </label>
          <label>
            <span>Amount Step % (per level up)</span>
            <input type="number" id="f-amount_step_pct" step="any" required />
          </label>
          <label>
            <span>Take-Profit Base %</span>
            <input type="number" id="f-take_profit_base_pct" step="any" required />
          </label>
          <label>
            <span>Take-Profit Step %</span>
            <input type="number" id="f-take_profit_step_pct" step="any" required />
          </label>
        </div>
        <div id="create-error" class="error" hidden></div>
        <div class="actions">
          <button type="submit" class="btn primary">Create Cascade</button>
          <button type="button" id="cancel-create-btn" class="btn">Cancel</button>
        </div>
      </form>

      <form id="template-form" class="create-form" hidden>
        <div class="form-grid">
          <label>
            <span>Pair</span>
            <input type="text" id="t-symbol" placeholder="DOGE_USDT" required />
          </label>
          <label>
            <span>Trigger Price <em>(optional)</em></span>
            <input type="number" id="t-trigger_price" step="any" placeholder="arm immediately if blank" />
          </label>
        </div>

        <table class="levels-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Buy Price</th>
              <th>Amount (USDT)</th>
              <th>Sell Price</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="template-rows-tbody"></tbody>
        </table>
        <div class="actions" style="margin-top:0.75rem;">
          <button type="button" id="template-add-row-btn" class="btn">+ Add Level</button>
        </div>

        <div id="template-error" class="error" hidden></div>
        <div class="actions">
          <button type="submit" class="btn primary">Create Template Cascade</button>
          <button type="button" id="cancel-template-btn" class="btn">Cancel</button>
        </div>
      </form>

      <table class="cascades-table">
        <thead>
          <tr>
            <th>Symbol</th>
            <th>Status</th>
            <th>Base Price</th>
            <th>Levels</th>
            <th>Created</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="cascades-tbody">
          <tr><td colspan="6" class="empty">Loading…</td></tr>
        </tbody>
      </table>
    </section>

    <section id="detail-view" hidden>
      <div class="section-head">
        <button id="back-btn" class="btn">&larr; Back to list</button>
      </div>
      <div id="detail-error" class="error" hidden></div>

      <div class="cascade-header" id="cascade-header"></div>

      <div class="actions" id="cascade-actions"></div>

      <h3>Buy Orders</h3>
      <table class="levels-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Pair</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Amount</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="buy-orders-tbody"></tbody>
      </table>

      <h3>Sell Orders</h3>
      <table class="levels-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Pair</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Amount</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="sell-orders-tbody"></tbody>
      </table>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
